<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>뽀모도로 칸반보드</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-neutral-50 text-neutral-900 antialiased dark:bg-neutral-950 dark:text-neutral-100">
  <header class="border-b border-neutral-200 bg-white/80 backdrop-blur dark:border-neutral-800 dark:bg-neutral-900/80">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6">
      <h1 class="text-lg font-bold tracking-tight">🍅 뽀모도로 칸반보드</h1>
      <button type="button" data-app-menu aria-label="설정" title="설정" aria-haspopup="menu" class="flex h-9 w-9 items-center justify-center rounded-lg text-neutral-500 transition hover:bg-neutral-100 hover:text-neutral-800 dark:hover:bg-neutral-800 dark:hover:text-neutral-200">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
      </button>
    </div>
  </header>

  <main class="mx-auto grid max-w-7xl gap-6 px-4 py-6 sm:px-6 lg:grid-cols-[1fr_20rem]">
    <div class="grid items-start gap-4 md:grid-cols-3">
      <section class="flex flex-col rounded-2xl bg-neutral-100 p-3 dark:bg-neutral-900">
        <h2 class="mb-3 flex items-center gap-2 px-1 text-sm font-semibold">
          <span class="h-2 w-2 rounded-full bg-neutral-400"></span>
          할 일
          <span data-overdue="todo" hidden class="rounded-full bg-red-50 px-1.5 py-0.5 text-xs font-medium text-red-500 dark:bg-red-500/10"></span>
          <span data-count="todo" class="ml-auto text-neutral-400"></span>
        </h2>
        <ul data-list="todo" data-empty="할일이 없습니다" class="flex min-h-[4.5rem] flex-col gap-2"></ul>
        <div data-add="todo" class="mt-2">
          <button type="button" data-add-open class="w-full rounded-xl px-2 py-2 text-left text-sm text-neutral-500 transition hover:bg-neutral-200 dark:hover:bg-neutral-800">+ 새로운 할일</button>
          <input data-add-input hidden placeholder="할일 입력 후 Enter" class="w-full rounded-xl border border-neutral-200 bg-white px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-orange-400 dark:border-neutral-700 dark:bg-neutral-800">
        </div>
      </section>

      <section class="flex flex-col rounded-2xl bg-neutral-100 p-3 dark:bg-neutral-900">
        <h2 class="mb-3 flex items-center gap-2 px-1 text-sm font-semibold">
          <span class="h-2 w-2 rounded-full bg-blue-500"></span>
          진행 중
          <span data-overdue="doing" hidden class="rounded-full bg-red-50 px-1.5 py-0.5 text-xs font-medium text-red-500 dark:bg-red-500/10"></span>
          <span data-count="doing" class="ml-auto text-neutral-400"></span>
        </h2>
        <ul data-list="doing" data-empty="진행 중인 할일이 없습니다" class="flex min-h-[4.5rem] flex-col gap-2"></ul>
        <div data-add="doing" class="mt-2">
          <button type="button" data-add-open class="w-full rounded-xl px-2 py-2 text-left text-sm text-neutral-500 transition hover:bg-neutral-200 dark:hover:bg-neutral-800">+ 새로운 할일</button>
          <input data-add-input hidden placeholder="할일 입력 후 Enter" class="w-full rounded-xl border border-neutral-200 bg-white px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-orange-400 dark:border-neutral-700 dark:bg-neutral-800">
        </div>
      </section>

      <section class="flex flex-col rounded-2xl bg-neutral-100 p-3 dark:bg-neutral-900">
        <h2 class="mb-3 flex items-center gap-2 px-1 text-sm font-semibold">
          <span class="h-2 w-2 rounded-full bg-orange-500"></span>
          완료
          <span class="ml-auto flex items-center gap-3">
            <button type="button" data-clear-done hidden class="text-xs font-normal text-neutral-400 transition hover:text-red-500">모두 지우기</button>
            <span data-count="done" class="text-neutral-400"></span>
          </span>
        </h2>
        <ul data-list="done" data-empty="완료된 할일이 없습니다" class="flex min-h-[4.5rem] flex-col gap-2"></ul>
      </section>
    </div>

    <aside data-timer class="h-fit rounded-2xl border border-neutral-200 bg-white p-5 shadow-sm lg:sticky lg:top-6 dark:border-neutral-800 dark:bg-neutral-900">
      <div class="flex items-center justify-between">
        <div role="tablist" aria-label="타이머 모드" class="flex rounded-lg bg-neutral-100 p-0.5 text-sm dark:bg-neutral-800">
          <button type="button" role="tab" data-mode="work" class="rounded-md px-3 py-1 text-neutral-500 transition aria-selected:bg-white aria-selected:font-semibold aria-selected:text-neutral-900 aria-selected:shadow-sm dark:aria-selected:bg-neutral-700 dark:aria-selected:text-white">작업</button>
          <button type="button" role="tab" data-mode="break" class="rounded-md px-3 py-1 text-neutral-500 transition aria-selected:bg-white aria-selected:font-semibold aria-selected:text-neutral-900 aria-selected:shadow-sm dark:aria-selected:bg-neutral-700 dark:aria-selected:text-white">휴식</button>
        </div>
        <button type="button" data-mute class="flex h-9 w-9 items-center justify-center rounded-lg text-neutral-400 transition hover:bg-neutral-100 hover:text-neutral-700 dark:hover:bg-neutral-800 dark:hover:text-neutral-200"></button>
      </div>

      <div class="relative mx-auto my-5 aspect-square w-full max-w-[15rem]">
        <svg data-dial role="slider" tabindex="0" aria-label="남은 시간" aria-valuemin="1" class="h-full w-full touch-none select-none rounded-full outline-none focus-visible:ring-2 focus-visible:ring-orange-400"></svg>
        <div class="pointer-events-none absolute inset-0 flex flex-col items-center justify-center">
          <span data-time class="text-5xl font-semibold tabular-nums tracking-tight">25:00</span>
          <span data-status class="mt-1 text-sm text-neutral-400">준비</span>
        </div>
      </div>

      <div class="flex items-center justify-center gap-4">
        <button type="button" data-reset aria-label="초기화" title="초기화" class="flex h-11 w-11 items-center justify-center rounded-full text-neutral-500 transition hover:bg-neutral-100 hover:text-neutral-800 dark:hover:bg-neutral-800 dark:hover:text-neutral-200">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5"><path d="M3 12a9 9 0 109-9 9.7 9.7 0 00-6.7 2.8L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button type="button" data-toggle class="h-12 min-w-[7.5rem] rounded-full px-6 font-semibold text-white shadow-sm transition hover:brightness-110 active:scale-95">시작</button>
        <button type="button" data-skip aria-label="건너뛰기" title="건너뛰기" class="flex h-11 w-11 items-center justify-center rounded-full text-neutral-500 transition hover:bg-neutral-100 hover:text-neutral-800 dark:hover:bg-neutral-800 dark:hover:text-neutral-200">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5"><path d="M5 4l10 8-10 8V4zM19 5v14"/></svg>
        </button>
      </div>

      <p data-focus class="mt-5 text-center text-sm text-neutral-500"></p>

      <details class="mt-4 border-t border-neutral-100 pt-4 text-sm dark:border-neutral-800">
        <summary data-settings-summary class="cursor-pointer list-none text-neutral-500 transition hover:text-neutral-800 dark:hover:text-neutral-200"></summary>
        <div class="mt-3 space-y-3">
          <label class="flex items-center justify-between gap-3">
            작업 시간
            <span class="flex items-center gap-1.5 text-neutral-500"><input type="number" data-setting="workMin" min="1" max="60" class="w-16 rounded-md border border-neutral-200 bg-white px-2 py-1 text-right text-neutral-900 dark:border-neutral-700 dark:bg-neutral-800 dark:text-neutral-100">분</span>
          </label>
          <label class="flex items-center justify-between gap-3">
            휴식 시간
            <span class="flex items-center gap-1.5 text-neutral-500"><input type="number" data-setting="breakMin" min="1" max="60" class="w-16 rounded-md border border-neutral-200 bg-white px-2 py-1 text-right text-neutral-900 dark:border-neutral-700 dark:bg-neutral-800 dark:text-neutral-100">분</span>
          </label>
          <label class="flex items-center justify-between gap-3">
            작업이 끝나면 휴식 자동 시작
            <input type="checkbox" data-setting="autoStart" class="h-4 w-4 accent-orange-500">
          </label>
        </div>
      </details>
    </aside>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
